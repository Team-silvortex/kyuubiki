name: Web CI Diagnostic

on:
  push:
    branches: [fix/ci-web-diagnostic-20260919]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve exact web source for diagnosis
        run: |
          mkdir -p tmp/web-ci-diagnostic
          git rev-parse HEAD > tmp/web-ci-diagnostic/revision.txt
          git archive 82198dcca7d432e70ab32109388d1e2976ad7884 apps/web > tmp/web-ci-diagnostic/web-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: web-ci-diagnostic-source
          path: tmp/web-ci-diagnostic
          retention-days: 3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.0"
      - uses: actions/cache/restore@v4
        with:
          path: |
            apps/web/deps
            apps/web/_build
          key: ${{ runner.os }}-beam-web-${{ hashFiles('apps/web/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-web-
      - working-directory: apps/web
        run: mix deps.get
      - name: Reproduce the original seed without retries masking results
        working-directory: apps/web
        run: |
          set +e
          mix test --seed 133328 2>&1 | tee ../../tmp/web-ci-diagnostic/original-seed.log
          code=${PIPESTATUS[0]}
          echo "$code" > ../../tmp/web-ci-diagnostic/original-seed.exit
          mix test --seed 133328 --trace 2>&1 | tee ../../tmp/web-ci-diagnostic/original-seed-trace.log
          code=${PIPESTATUS[0]}
          echo "$code" > ../../tmp/web-ci-diagnostic/original-seed-trace.exit
          echo 'Diagnostic only: individual exit codes are retained; this is not an acceptance gate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ci-diagnostic-results
          path: tmp/web-ci-diagnostic
          retention-days: 3
