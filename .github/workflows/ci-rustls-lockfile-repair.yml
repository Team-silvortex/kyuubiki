name: Temporary Rustls Lockfile Repair

on:
  push:
    branches: [fix/ci-capacity-and-fmt-20260919]
    paths: [.github/workflows/ci-rustls-lockfile-repair.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'Team-silvortex/kyuubiki'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75d1da6ae41c573d1f15c061676c0707f4c63389
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workers/rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Generate targeted security updates with Cargo
        shell: bash
        run: |
          set -euo pipefail
          for workspace in workers/rust apps/hub-gui/src-tauri apps/installer-gui/src-tauri; do
            cargo update --manifest-path "$workspace/Cargo.toml" -p rustls@0.23.43 --precise 0.23.45
            cargo metadata --locked --format-version 1 --manifest-path "$workspace/Cargo.toml" > /dev/null
          done
          git diff --check
          python3 - <<'PY'
          import pathlib, subprocess, tomllib
          paths = {"workers/rust/Cargo.lock", "apps/hub-gui/src-tauri/Cargo.lock", "apps/installer-gui/src-tauri/Cargo.lock"}
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != paths:
              raise SystemExit(f"unexpected changed paths: {sorted(changed)}")
          for path in sorted(paths):
              packages = tomllib.loads(pathlib.Path(path).read_text())["package"]
              versions = [p["version"] for p in packages if p["name"] == "rustls" and p["version"].startswith("0.23.")]
              if versions != ["0.23.45"]:
                  raise SystemExit(f"unexpected rustls versions in {path}: {versions}")
          PY
      - name: Audit the generated lockfiles without advisory exceptions
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --file workers/rust/Cargo.lock
          cargo audit --no-fetch --file apps/hub-gui/src-tauri/Cargo.lock
          cargo audit --no-fetch --file apps/installer-gui/src-tauri/Cargo.lock
      - name: Check the Rust workspace with the generated lockfile
        run: cargo check --locked --manifest-path workers/rust/Cargo.toml
      - name: Review diff and create unattached blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat
          git diff -- workers/rust/Cargo.lock apps/hub-gui/src-tauri/Cargo.lock apps/installer-gui/src-tauri/Cargo.lock
          git diff --binary > "$RUNNER_TEMP/kyuubiki-rustls-lockfiles.patch"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          repository = os.environ["GITHUB_REPOSITORY"]
          if repository != "Team-silvortex/kyuubiki":
              raise SystemExit("unexpected repository")
          result = {"source_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "files": []}
          for path in ("workers/rust/Cargo.lock", "apps/hub-gui/src-tauri/Cargo.lock", "apps/installer-gui/src-tauri/Cargo.lock"):
              data = pathlib.Path(path).read_bytes()
              expected = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              payload = json.dumps({"content": data.decode("utf-8"), "encoding": "utf-8"})
              response = json.loads(subprocess.check_output(["gh", "api", "--method", "POST", f"repos/{repository}/git/blobs", "--input", "-"], input=payload, text=True))
              if response["sha"] != expected:
                  raise SystemExit(f"blob digest mismatch for {path}")
              result["files"].append({"path": path, "sha": expected, "sha256": hashlib.sha256(data).hexdigest()})
          output = json.dumps(result, sort_keys=True)
          pathlib.Path(os.environ["RUNNER_TEMP"], "kyuubiki-lockfile-blobs.json").write_text(output + "\n")
          print("LOCKFILE_BLOBS_JSON=" + output)
          PY
      - name: Preserve preparation evidence
        uses: actions/upload-artifact@v4
        with:
          name: rustls-lockfile-repair-evidence
          path: |
            ${{ runner.temp }}/kyuubiki-rustls-lockfiles.patch
            ${{ runner.temp }}/kyuubiki-lockfile-blobs.json
          if-no-files-found: error
          retention-days: 7
