[[permission]]
identifier = "allow-service-status"
description = "Enables the service_status command."
commands.allow = ["service_status"]

[[permission]]
identifier = "allow-packaged-boot-ready"
description = "Enables the packaged_boot_ready command."
commands.allow = ["packaged_boot_ready"]

[[permission]]
identifier = "allow-read-runtime-log"
description = "Enables the read_runtime_log command."
commands.allow = ["read_runtime_log"]

[[permission]]
identifier = "allow-guarded-mutation-action"
description = "Enables the guarded_mutation_action command."
commands.allow = ["guarded_mutation_action"]

[[permission]]
identifier = "allow-workbench-environment"
description = "Enables the workbench_environment command."
commands.allow = ["workbench_environment"]

[[permission]]
identifier = "allow-get-global-language-preference"
description = "Enables the get_global_language_preference command."
commands.allow = ["get_global_language_preference"]

[[permission]]
identifier = "allow-set-global-language-preference"
description = "Enables the set_global_language_preference command."
commands.allow = ["set_global_language_preference"]

[[permission]]
identifier = "allow-get-workbench-panel-layout"
description = "Reads only the fixed Workbench panel layout preference."
commands.allow = ["get_workbench_panel_layout"]

[[permission]]
identifier = "allow-set-workbench-panel-layout"
description = "Writes only validated Workbench panel dimensions, not arbitrary preferences or files."
commands.allow = ["set_workbench_panel_layout"]

[[permission]]
identifier = "allow-checkpoint-recovery"
description = "Manage only bounded checkpoint identity metadata in a fixed application-owned journal; no paths, payloads or credentials."
commands.allow = ["list_checkpoint_intents", "reserve_checkpoint_intent", "remove_checkpoint_intent"]

[[permission]]
identifier = "allow-direct-execution-journal"
description = "Manage bounded direct execution identities in a fixed application-owned journal, never model inputs or credentials."
commands.allow = ["direct_execution_journal"]

[[permission]]
identifier = "allow-open-store-account-portal"
description = "Open only the fixed account page at an explicit validated HTTPS origin; no arbitrary redirect, credentials or shell command."
commands.allow = ["open_store_account_portal"]

[[permission]]
identifier = "allow-store-download"
description = "Browse the account store, download bounded signed releases and explicitly install verified local operator packages without activation."
commands.allow = ["store_download", "store_catalog"]

[[permission]]
identifier = "allow-store-identity"
description = "Manage a memory-only native OIDC session through bounded actions; never expose credentials to the page."
commands.allow = ["store_identity"]

[[permission]]
identifier = "allow-project-operator"
description = "Verify installed operator bytes, manage explicit project pins and prepare TaskIR. No account access, arbitrary paths, Agent startup or execution."
commands.allow = ["project_operator"]
