[package]
name = "kyuubiki-headless-sdk"
version = "3.7.7"
edition = "2024"
license = "MIT"

[dependencies]
kyuubiki-agent-transport = { version = "3.7.7", path = "../../workers/rust/crates/agent-transport" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.14"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }

[[example]]
name = "model_driven_thermal_research"
test = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false
