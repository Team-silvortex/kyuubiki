[package]
name = "kyuubiki-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kyuubiki-engine = { path = "../engine" }
kyuubiki-headless-sdk = { path = "../headless-sdk" }
kyuubiki-protocol = { path = "../protocol" }
kyuubiki-solver = { path = "../solver" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
kyuubiki-installer = { path = "../installer" }
