[package]
name = "kyuubiki-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kyuubiki-engine = { path = "../engine" }
kyuubiki-headless-sdk = { path = "../headless-sdk" }
kyuubiki-protocol = { path = "../protocol" }
kyuubiki-solver = { path = "../solver" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
