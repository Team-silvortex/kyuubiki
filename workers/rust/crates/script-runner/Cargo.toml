[package]
name = "kyuubiki-script-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kyuubiki-desktop-runtime = { path = "../desktop-runtime" }
kyuubiki-cli = { path = "../cli" }
kyuubiki-engine = { path = "../engine" }
kyuubiki-installer = { path = "../installer" }
kyuubiki-kcore = { path = "../kcore" }
kyuubiki-operator-sdk = { path = "../operator-sdk" }
kyuubiki-project-automation = { path = "../project-automation" }
kyuubiki-project-bundle = { path = "../project-bundle" }
kyuubiki-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
libc = "0.2"
getrandom = "0.4"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
