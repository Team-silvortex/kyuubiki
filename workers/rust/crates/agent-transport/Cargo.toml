[package]
name = "kyuubiki-agent-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"

[dev-dependencies]
rcgen = "0.14"
